<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検索結果｜作業日報</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#182230;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b63;color:white;padding:22px max(18px,calc((100% - 760px)/2))}h1{font-size:23px;margin:0}main{max-width:760px;margin:22px auto;padding:0 16px}.panel{background:white;border:1px solid #dce3eb;border-radius:14px;padding:18px;margin-bottom:18px}button,.linkbtn{font:inherit;border:0;border-radius:9px;padding:12px 16px;background:#175da8;color:white;font-weight:650;text-decoration:none;display:inline-block}.item{padding:15px 0;border-top:1px solid #e5eaf0}.item h2{font-size:18px;margin:0 0 8px}.meta{color:#526477;font-size:14px}.item p{white-space:pre-wrap;line-height:1.6}.empty{padding:25px;text-align:center;color:#637386}.hint{font-size:13px;color:#596879;line-height:1.6}
</style></head><body><header><h1>作業日報・検索結果</h1></header><main><section class="panel"><p id="criteria" class="hint"></p><div id="results"></div><p class="hint">検索結果は、この端末・ブラウザに保存された日報から表示しています。</p><a class="linkbtn" href="index.html">入力・検索ページへ戻る</a></section></main>
<script>
const KEY='workReportsV1',params=new URLSearchParams(location.search),q=(params.get('q')||'').toLocaleLowerCase(),date=params.get('date')||'';
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
document.getElementById('criteria').textContent='検索条件：'+(q||'指定なし')+' ／ '+(date||'日付指定なし');
const matches=data.filter(x=>(!q||(x.name+' '+x.work+' '+x.tools).toLocaleLowerCase().includes(q))&&(!date||x.date===date)).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
const root=document.getElementById('results');
if(!matches.length){root.innerHTML='<div class="empty">該当する日報はありません。</div>'}
else matches.forEach(x=>{const article=document.createElement('article');article.className='item';const h=document.createElement('h2');h.textContent=x.name+'｜'+x.date;const meta=document.createElement('div');meta.className='meta';meta.textContent=x.start+'〜'+x.end;const work=document.createElement('p');work.textContent='作業内容：'+x.work;const tools=document.createElement('p');tools.textContent='使用機材や道具：'+(x.tools||'未入力');article.append(h,meta,work,tools);root.append(article)});
</script></body></html>
